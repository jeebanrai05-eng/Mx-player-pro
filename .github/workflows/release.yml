name: Build & Release Ultra Video Player Pro APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Ultra Video Player Pro Release'

jobs:
  build-release:
    name: Build & Upload Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Decode Base64 Keystore from GitHub Secret
      - name: Decode Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "Keystore successfully decoded to ${{ github.workspace }}/my-upload-key.jks"
          else
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing or empty!"
            exit 1
          fi

      # Build Release APK using Gradle
      - name: Build Release APK
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"
          STORE_PASSWORD: "${{ secrets.RELEASE_STORE_PASSWORD }}"
          KEY_PASSWORD: "${{ secrets.RELEASE_KEY_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.RELEASE_KEY_ALIAS }}"
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      # Upload APK to Workflow Artifacts (Immediate direct download)
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraVideoPlayer-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Create GitHub Release & Upload APK asset
      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
          body: |
            ### 🚀 Ultra Video Player Pro Release
            - High-performance native Android video player
            - Hardware acceleration with Android MediaCodec
            - Smart MX Gestures & Touch Controls
            - White Modern Theme with AMOLED Dark Mode
            - Background Audio & PiP support
            - In-app Self-Update enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
