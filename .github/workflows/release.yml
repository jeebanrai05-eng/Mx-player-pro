name: Build & Release Ultra Video Player Pro APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Ultra Video Player Pro Release'

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java 21 is required for Android Gradle Plugin 9.1.1 & Kotlin 2.2.10
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle 9.3.1 matches gradle-wrapper.properties and AGP 9.1.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # Smart Keystore Setup: Uses user secrets if configured, or auto-generates release key as fallback
      - name: Configure Release Keystore
        id: keystore_setup
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release.keystore"
          
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] && [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::notice::Using custom repository secrets for release signing."
            # Strip potential whitespace and linebreaks before decoding
            echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
            
            if [ ! -s "$KEYSTORE_FILE" ]; then
              echo "::error::Base64 keystore decoding produced an empty file. Check RELEASE_KEYSTORE_BASE64 secret."
              exit 1
            fi
            
            echo "STORE_PASS=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_AL=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          else
            echo "::warning::Repository secrets not found or incomplete. Generating an automated release key for this build so the release workflow succeeds."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "ultrarelease" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ultrasecurepass123" \
              -keypass "ultrasecurepass123" \
              -dname "CN=UltraVideoPlayer, OU=Mobile, O=UltraVideo, L=City, ST=State, C=US"
              
            echo "STORE_PASS=ultrasecurepass123" >> $GITHUB_ENV
            echo "KEY_PASS=ultrasecurepass123" >> $GITHUB_ENV
            echo "KEY_AL=ultrarelease" >> $GITHUB_ENV
          fi
          
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      # Build Signed Release APK
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
          KEY_ALIAS: ${{ env.KEY_AL }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      # Prepare Release Artifacts and Generate SHA-256 Checksum
      - name: Prepare Assets & Checksum
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          cd "$OUTPUT_DIR"
          
          # Find generated APK and standardize to app-release.apk
          ORIGINAL_APK=$(ls *.apk | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "::error::No release APK found in $OUTPUT_DIR"
            exit 1
          fi
          
          if [ "$ORIGINAL_APK" != "app-release.apk" ]; then
            cp "$ORIGINAL_APK" app-release.apk
          fi
          
          # Compute SHA-256 Checksum for verification
          sha256sum app-release.apk > app-release.apk.sha256
          echo "Generated SHA-256 Checksum:"
          cat app-release.apk.sha256

      # Always upload APK directly to GitHub Actions Artifacts tab for instant download
      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltraVideoPlayer-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # Determine Release Tag for GitHub Releases
      - name: Determine Tag Name
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="${{ github.event.inputs.release_title }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Ultra Video Player Pro $TAG"
          else
            # For branch pushes, use build run number to avoid tag conflicts
            TAG="v1.0.0-build.${{ github.run_number }}"
            TITLE="Ultra Video Player Pro $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      # Publish GitHub Release with APK & SHA-256 asset
      - name: Publish GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          body: |
            ### 🚀 Ultra Video Player Pro Release ${{ steps.release_info.outputs.tag }}
            
            **What's New:**
            - Modern White Theme with AMOLED Dark Theme toggle
            - In-App Self-Update with SHA-256 integrity verification
            - Hardware acceleration with Android MediaCodec
            - Smart MX Gestures (Volume, Brightness, Seek, Double-Tap)
            - Background Audio Playback & Picture-in-Picture
            - 4-Digit Privacy PIN Lock
            
            **Verification:**
            - Checksum file: `app-release.apk.sha256`
            - Package ID: `com.ultravideo.player`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release Status Note
        if: steps.gh_release.outcome == 'failure'
        run: |
          echo "::warning::GitHub Release creation encountered an error (typically due to repository permissions)."
          echo "To enable GitHub Releases publishing:"
          echo "1. Go to repository Settings -> Actions -> General"
          echo "2. Under 'Workflow permissions', select 'Read and write permissions'"
          echo "3. Save settings and re-run the workflow."
          echo "NOTE: Your release APK was still built and successfully uploaded to the 'Artifacts' section of this workflow run!"
